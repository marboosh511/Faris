   m.style.background='linear-gradient(135deg,#70451f,#c08a4b)';

  },{once:true});
  m.addEventListener('load',()=>{
   const clips=m.availableAnimations||[];
   if(!clips.length){ host.classList.add('idle-no-rig'); return; }
   const findClip=(pattern)=>clips.find(name=>pattern.test(name));
   const idle=findClip(/idle|stand|breath|rest/i)||clips[0];
   const walk=findClip(/walk|stroll|step/i);
   const head=findClip(/head|neck|graze|look/i);
   const tail=findClip(/tail|swish/i);
   let timer=null, busy=false;
   const play=(clip,duration)=>{
    if(!clip||busy)return; busy=true;
    m.animationName=clip; m.play();
    if(timer)clearTimeout(timer);
    timer=setTimeout(()=>{m.animationName=idle;m.play();busy=false;},duration||3000);
   };
   m.animationName=idle; m.play();
   // Keep each horse mostly at rest, then give it a short authentic gesture if the rig contains one.
   const sequence=()=>{
    if(busy)return;
    if(index===0 && walk){host.classList.add('walking');play(walk,4400);setTimeout(()=>host.classList.remove('walking'),4700);return;}
    const gesture=index===0?(head||tail):(tail||head);
    if(gesture)play(gesture,2600); else play(idle,3000);
   };
   setTimeout(sequence,index===0?9000:6500);
   setInterval(sequence,index===0?25000:19000);
  },{once:true});
 });
});

 // 9) Refresh existing profile and HUD counters from the same local records.
 function updateProfile(){
  const stats=document.querySelectorAll('#panelBody .profile-stats b');if(stats[0])stats[0].textContent=C.length;if(stats[1])stats[1].textContent=arenaRows().length;
  const details=document.querySelectorAll('#panelBody #profileDetails .profile-detail-row b');if(details[2])details[2].textContent=C.length;
 }

 // 10) Rehydrate the current existing screen on entry and synchronize across browser tabs.
 const previousOpen=window.openPanel;
 window.openPanel=function(key){previousOpen(key);if(key==='stable'){renderStable();}else if(key==='breeding'){syncBreeding();}else if(key==='market'){syncMarketSelect();renderMarket();}else if(key==='contests'){syncArena();renderArena();}else if(key==='profile'){updateProfile();}};
 window.addEventListener('storage',e=>{
  if(e.key===MARKET){if($('marketResults')){syncMarketSelect();renderMarket();}}
  if(e.key===ARENA){if($('arenaRegisteredList')){syncArena();renderArena();}updateProfile();}
 });
 window.addEventListener('pageshow',()=>{migrate();updateHorseCounters();});
 document.addEventListener('DOMContentLoaded',()=>{migrate();updateHorseCounters();});
 migrate();updateHorseCounters();
})();

</script>
